# Runs as non-root (UID 102): no "user" directive, pid and temp paths are writable locations.
worker_processes auto;
pid /tmp/nginx.pid;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------- App (port 8080) ----------
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        # add_header in a location replaces server-level headers, so they are set per location.

        # Root → app path
        location = / {
            return 302 /handson-yousuf/;
        }

        location = /handson-yousuf {
            return 301 /handson-yousuf/;
        }

        # Hashed static assets: cache long
        location ~* ^/handson-yousuf/.+\.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            try_files $uri =404;
        }

        # SPA routing fallback; never cache index.html
        location /handson-yousuf/ {
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            try_files $uri $uri/ /handson-yousuf/index.html;
        }
    }

    # ---------- Health (port 8081) ----------
    server {
        listen 8081;
        server_name _;
        access_log off;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 404;
        }
    }
}
